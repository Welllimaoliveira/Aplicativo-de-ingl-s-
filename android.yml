name: Gerar APK Fala Real v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib
          h=pathlib.Path('app/src/main/assets/index.html').read_text()
          s='\n'.join(re.findall(r'<script>(.*?)</script>',h,re.S))
          pathlib.Path('/tmp/app.js').write_text(s)
          PY
          node --check /tmp/app.js
      - name: Gerar APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fala-Real-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
